<!--
  URP DESIGN CATALOGUE  ·  folder browser
  • Click a folder to open it. Click a screen to view its design.
  • Add / change a link right on the card (link button).
  • Add a cover photo on any card (photo button) — shows as the thumbnail.
  Figma files must be shared as "Anyone with the link → can view".
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>URP · Design Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<script>
const CATALOGUE = {
  title: "URP",
  tree: [
    { id: "overview", label: "Overview", figma: "" },
    { id: "onboarding", label: "Onboarding & Invitations", children: [
      { id: "onboarding-flow", label: "Onboarding Flow", figma: "" },
      { id: "join-org", label: "Join Organisation", figma: "" },
      { id: "invite-member", label: "Invite Team Member", figma: "" },
      { id: "invite-expired", label: "Expired Invitation Link", figma: "" },
    ]},
    { id: "organisation", label: "Organisation", children: [
      { id: "org-create", label: "Create Organisation", children: [
        { id: "org-create-step1", label: "Step 1 — Organisation", figma: "" },
        { id: "org-create-step2", label: "Step 2 — Workspace", figma: "" },
      ]},
      { id: "org-switcher", label: "Organisation Switcher", figma: "" },
      { id: "org-delete", label: "Delete Organisation", figma: "" },
      { id: "org-logo", label: "Organisation Logo Upload", figma: "" },
    ]},
    { id: "settings", label: "Settings", children: [
      { id: "settings-rbac", label: "RBAC", figma: "" },
      { id: "settings-profile", label: "Profile", figma: "" },
      { id: "settings-org-details", label: "Organisation Details", figma: "" },
      { id: "settings-members", label: "Members", children: [
        { id: "members-list", label: "Members List", figma: "" },
        { id: "members-remove", label: "Remove Member", figma: "" },
      ]},
      { id: "settings-devices", label: "Devices", children: [
        { id: "devices-list", label: "Devices List", figma: "" },
        { id: "devices-delete", label: "Delete Device", figma: "" },
      ]},
      { id: "settings-automations", label: "Automations", children: [
        { id: "automations-list", label: "Automations List", figma: "" },
        { id: "automations-delete", label: "Delete Automation", figma: "" },
      ]},
    ]},
    { id: "billing", label: "Billing", children: [
      { id: "billing-details", label: "Billing Details & Upgrade", children: [
        { id: "billing-plans", label: "Plan Management", figma: "" },
        { id: "billing-credits", label: "Credits", figma: "" },
      ]},
      { id: "billing-usage", label: "Usage Monitoring & Alerts", figma: "" },
      { id: "billing-invoices", label: "Invoices & Payment", figma: "" },
      { id: "billing-superadmin", label: "NF Super Admin Console", figma: "" },
    ]},
    { id: "canvas", label: "Canvas & Widgets", children: [
      { id: "canvas-onboarding", label: "Canvas Onboarding", figma: "" },
      { id: "widget-video-feed", label: "Video Feed Widget", figma: "" },
    ]},
    { id: "templates", label: "Templates", figma: "" },
  ],
};

/* Change this passcode. Anyone who knows it can edit; everyone else is view-only. */
const EDIT_CODE = "urp-admin";
</script>

<style>
  :root {
    --bg:#181818; --card:#232323; --card-hover:#2c2c2c; --line:#333; --line-2:#454545;
    --ink:#ededed; --dim:#8b8b8b; --accent:#ff5926;
    --f-title:"Space Grotesk",system-ui,sans-serif; --f:"Inter",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { font-family:var(--f); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1280px; margin:0 auto; padding:22px 26px 60px; }

  .top { display:flex; align-items:center; gap:14px; padding:6px 0 18px; }
  .brand .name { font-family:var(--f-title); font-weight:700; font-size:20px; letter-spacing:-0.01em; margin-right:6px; }
  .brand .name b { color:var(--accent); }
  .crumbs { flex:1; min-width:0; display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--dim); flex-wrap:wrap; }
  .crumbs .c { cursor:pointer; }
  .crumbs .c:hover { color:var(--ink); text-decoration:underline; }
  .crumbs .c.here { color:var(--ink); cursor:default; text-decoration:none; }
  .crumbs .arrow { color:#5a5a5a; }
  .editbtn { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .editbtn:hover { background:var(--card-hover); border-color:var(--line-2); }
  .editbtn svg { width:14px; height:14px; }
  .editbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .editbtn.on:hover { background:#ec4b1c; }

  .section-title { font-family:var(--f-title); font-weight:600; font-size:22px; margin:0 0 18px; letter-spacing:-0.01em; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .card { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    cursor:pointer; padding:0; color:inherit; font:inherit; transition:border-color .14s,background .14s,transform .05s; }
  .card:hover { background:var(--card-hover); border-color:var(--line-2); }
  .card:active { transform:translateY(1px); }

  .thumb { height:132px; display:flex; align-items:center; justify-content:center; position:relative;
    border-bottom:1px solid var(--line); overflow:hidden; }
  .thumb.folder { background:linear-gradient(160deg,#2b2b2b,#202020); }
  .thumb.screen { background:linear-gradient(160deg,#242424,#1d1d1d); }
  .thumb .big { width:44px; height:44px; color:#6f6f6f; }
  .thumb.folder .big { color:#9a9a9a; }
  .thumb img.cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dot { position:absolute; top:10px; left:10px; width:9px; height:9px; border-radius:50%; background:transparent; border:1.5px solid #666; z-index:2; }
  .card.linked .dot { background:var(--accent); border-color:var(--accent); }
  .kebab { position:absolute; top:8px; right:8px; z-index:4; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;
    background:rgba(20,20,20,.55); border:1px solid rgba(255,255,255,.12); border-radius:7px; color:#e6e6e6; cursor:pointer; }
  .kebab:hover { background:rgba(45,45,45,.9); }
  .kebab svg { width:16px; height:16px; }

  .meta { padding:12px 13px; display:flex; align-items:center; gap:9px; }
  .meta .txt { min-width:0; flex:1; }
  .meta .lbl { display:block; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .sub { display:block; font-size:12px; color:var(--dim); margin-top:2px; }

  .menu { position:fixed; z-index:100; min-width:160px; background:#242424; border:1px solid var(--line-2); border-radius:10px; padding:5px; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .menu-item { display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); font:inherit; font-size:13px; padding:8px 10px; border-radius:7px; cursor:pointer; }
  .menu-item:hover { background:#333; }
  .menu-item.danger { color:#e0655a; }
  .menu-item.danger:hover { background:rgba(224,101,90,.12); }
  .menu-sep { height:1px; background:var(--line); margin:5px 4px; }

  /* Screen view */
  .stage { background:#111; border:1px solid var(--line); border-radius:12px; overflow:hidden; height:calc(100vh - 150px); position:relative; }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center; }
  .empty .en { font-size:14px; color:var(--dim); }
  .add { display:flex; gap:8px; width:min(460px,92%); }
  .add input { flex:1; font-family:var(--f); font-size:13px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; outline:none; background:#1c1c1c; color:var(--ink); }
  .add input:focus { border-color:var(--accent); }
  .add button { font-size:13px; font-weight:500; color:#fff; background:var(--accent); border:none; border-radius:8px; padding:0 16px; cursor:pointer; }
  .note { font-size:11.5px; color:var(--dim); max-width:46ch; line-height:1.5; } .note b { color:#b8b8b8; font-weight:500; }

  /* Link modal */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .ov.show { display:flex; }
  .mo { width:min(480px,100%); background:#212121; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .mo-t { font-family:var(--f-title); font-weight:600; font-size:16px; margin-bottom:12px; }
  .mo input { width:100%; font-family:var(--f); font-size:13px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:#1a1a1a; color:var(--ink); outline:none; }
  .mo input:focus { border-color:var(--accent); }
  .mo-note { font-size:11.5px; color:var(--dim); margin-top:10px; line-height:1.5; } .mo-note b { color:#b8b8b8; font-weight:500; }
  .mo-f { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .mo-f .sp { flex:1; }
  .mo-f button { font-size:13px; font-weight:500; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:#2a2a2a; color:var(--ink); }
  .mo-f button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mo-f button.ghost { background:none; border:none; color:#e0655a; padding:8px 4px; }
  .mo-f button.ghost:hover { text-decoration:underline; }

  .toast-wrap { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; z-index:200; pointer-events:none; }
  .toast { background:#2a2a2a; color:var(--ink); border:1px solid var(--line-2); border-radius:9px; padding:10px 15px; font-size:13px;
    box-shadow:0 12px 30px rgba(0,0,0,.5); display:flex; align-items:center; gap:9px; opacity:0; transform:translateY(10px); transition:opacity .2s,transform .2s; }
  .toast.show { opacity:1; transform:none; }
  .toast .tdot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:0 0 7px; }
</style>

<div class="wrap">
  <div class="top">
    <span class="brand"><span class="name" id="brandName"></span></span>
    <nav class="crumbs" id="crumbs"></nav>

</div></div>

<input type="file" id="photoIn" accept="image/*" style="display:none" />
<div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const idx = new Map();
  const LINKS = {};
  const IMAGES = {};
  let folderId = null, screenId = null, moTarget = null, photoTarget = null, editing = false;
  let lastLinksRaw = "{}", lastImagesRaw = "{}";

  (function build(nodes, parent) { nodes.forEach((n) => { idx.set(n.id, { node: n, parent }); if (n.children) build(n.children, n); }); })(CATALOGUE.tree, null);

  const isFolder = (n) => n.children && n.children.length;
  const linkOf = (n) => (n.id in LINKS ? LINKS[n.id] : (n.figma || ""));
  const childrenOf = (id) => (id == null ? CATALOGUE.tree : idx.get(id).node.children);

  function embed(url) {
    if (!url) return "";
    if (url.includes("embed.figma.com") || url.includes("figma.com/embed")) return url;
    const m = url.match(/figma\.com\/(design|file|proto|board|slides)\/([A-Za-z0-9]+)(?:\/([^?#]*))?/);
    if (!m) return "https://www.figma.com/embed?embed_host=share&url=" + encodeURIComponent(url);
    const node = new URLSearchParams((url.split("?")[1] || "").split("#")[0]).get("node-id");
    const kind = m[1] === "proto" ? "proto" : "design";
    let out = "https://embed.figma.com/" + kind + "/" + m[2] + "/" + encodeURIComponent(m[3] || "file") + "?embed-host=share";
    if (node) out += "&node-id=" + encodeURIComponent(node);
    if (kind === "proto") out += "&scaling=scale-down-width";
    return out;
  }

  async function load() {
    try { const a = await window.storage.get("urp_links", true); if (a && a.value) { Object.assign(LINKS, JSON.parse(a.value)); lastLinksRaw = a.value; } } catch (e) {}
    try { const b = await window.storage.get("urp_images", true); if (b && b.value) { Object.assign(IMAGES, JSON.parse(b.value)); lastImagesRaw = b.value; } } catch (e) {}
  }
  async function saveLinks() { const s = JSON.stringify(LINKS); lastLinksRaw = s; try { await window.storage.set("urp_links", s, true); } catch (e) {} }
  async function saveImages() { const s = JSON.stringify(IMAGES); lastImagesRaw = s; try { await window.storage.set("urp_images", s, true); } catch (e) {} }

  /* Toast */
  function toast(msg) {
    const wrap = $("#toastWrap"); if (!wrap) return;
    const t = document.createElement("div"); t.className = "toast";
    t.innerHTML = '<span class="tdot"></span>'; t.appendChild(document.createTextNode(msg));
    wrap.appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 220); }, 2400);
  }

  /* Auto-refresh: pull teammates' changes without a manual reload */
  async function poll() {
    if ($("#ov").classList.contains("show") || $("#pov").classList.contains("show") || menuEl) return; // don't disrupt an open editor/menu
    let changed = false;
    try {
      const a = await window.storage.get("urp_links", true);
      const raw = (a && a.value) ? a.value : "{}";
      if (raw !== lastLinksRaw) { lastLinksRaw = raw; for (const k in LINKS) delete LINKS[k]; Object.assign(LINKS, JSON.parse(raw)); changed = true; }
    } catch (e) {}
    try {
      const b = await window.storage.get("urp_images", true);
      const raw = (b && b.value) ? b.value : "{}";
      if (raw !== lastImagesRaw) { lastImagesRaw = raw; for (const k in IMAGES) delete IMAGES[k]; Object.assign(IMAGES, JSON.parse(raw)); changed = true; }
    } catch (e) {}
    if (changed) { render(); toast("Catalogue updated"); }
  }

  const folderIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
  const screenIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 20h8M12 17v3"/></svg>';
  const photoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg>';
  const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/></svg>';
  const xIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const kebabIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';

  function chainOf(id) { const a = []; let c = id == null ? null : idx.get(id); while (c) { a.unshift(c.node); c = c.parent ? idx.get(c.parent.id) : null; } return a; }

  function render() {
    const chain = chainOf(folderId);
    const crumbs = $("#crumbs"); crumbs.innerHTML = "";
    const root = document.createElement("span");
    root.className = "c" + (chain.length === 0 ? " here" : "");
    root.textContent = CATALOGUE.title; root.onclick = () => { folderId = null; render(); };
    crumbs.appendChild(root);
    chain.forEach((n, i) => {
      crumbs.appendChild(arrow());
      const s = document.createElement("span");
      const last = i === chain.length - 1;
      s.className = "c" + (last ? " here" : ""); s.textContent = n.label;
      s.onclick = () => { folderId = n.id; render(); };
      crumbs.appendChild(s);
    });
    updateEditBtn();
    renderGrid();
  }
  function arrow() { const a = document.createElement("span"); a.className = "arrow"; a.textContent = "›"; return a; }

  function renderGrid() {
    $("#sectionTitle").textContent = folderId == null ? "All areas" : idx.get(folderId).node.label;
    const view = $("#view"); view.innerHTML = "";
    const grid = document.createElement("div"); grid.className = "grid";
    childrenOf(folderId).forEach((n) => grid.appendChild(card(n)));
    view.appendChild(grid);
  }

  function card(node) {
    const folder = isFolder(node);
    const cover = IMAGES[node.id];
    const linked = !folder && linkOf(node);
    const b = document.createElement("button");
    b.className = "card" + (linked ? " linked" : "");

    const count = folder ? node.children.length : 0;
    const sub = folder ? (count + " item" + (count === 1 ? "" : "s")) : (linked ? "Linked" : "No link yet");

    b.innerHTML =
      '<div class="thumb ' + (folder ? "folder" : "screen") + '">' +
        (cover ? '<img class="cover" src="' + cover + '">' : '<span class="big">' + (folder ? folderIcon : screenIcon) + '</span>') +
        (editing ? '<span class="kebab" title="Options">' + kebabIcon + '</span>' : '') +
        (folder ? "" : '<span class="dot"></span>') +
      '</div>' +
      '<div class="meta">' +
        '<span class="txt"><span class="lbl"></span>' + (folder ? '<span class="sub">' + sub + '</span>' : '') + '</span>' +
      '</div>';
    b.querySelector(".lbl").textContent = node.label;

    b.onclick = () => {
      if (folder) { folderId = node.id; render(); }
      else { const l = linkOf(node); if (l) window.open(l, "_blank", "noopener"); else if (editing) openLink(node.id); }
    };
    const kb = b.querySelector(".kebab");
    if (kb) kb.onclick = (e) => { e.stopPropagation(); openMenu(node, e.currentTarget); };
    return b;
  }

  /* Kebab dropdown */
  let menuEl = null;
  function closeMenu() {
    if (!menuEl) return;
    menuEl.remove(); menuEl = null;
    document.removeEventListener("click", onDocClick, true);
    document.removeEventListener("keydown", onMenuKey);
    window.removeEventListener("scroll", closeMenu, true);
  }
  function onDocClick(e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
  function onMenuKey(e) { if (e.key === "Escape") closeMenu(); }
  function openMenu(node, anchor) {
    closeMenu();
    const folder = isFolder(node);
    const linked = !folder && linkOf(node);
    const hasPhoto = !!IMAGES[node.id];
    const items = [];
    if (!folder) {
      items.push({ label: linked ? "Change link" : "Add link", fn: () => openLink(node.id) });
      if (linked) items.push({ label: "Remove link", danger: true, fn: () => { LINKS[node.id] = ""; saveLinks(); render(); toast("Link removed · " + node.label); } });
      items.push({ sep: true });
    }
    items.push({ label: hasPhoto ? "Change photo" : "Add photo", fn: () => pickPhoto(node.id) });
    if (hasPhoto) items.push({ label: "Remove photo", danger: true, fn: () => { delete IMAGES[node.id]; saveImages(); renderGrid(); toast("Photo removed · " + node.label); } });

    menuEl = document.createElement("div"); menuEl.className = "menu";
    items.forEach((it) => {
      if (it.sep) { const d = document.createElement("div"); d.className = "menu-sep"; menuEl.appendChild(d); return; }
      const mb = document.createElement("button"); mb.className = "menu-item" + (it.danger ? " danger" : ""); mb.textContent = it.label;
      mb.onclick = (e) => { e.stopPropagation(); closeMenu(); it.fn(); };
      menuEl.appendChild(mb);
    });
    document.body.appendChild(menuEl);
    const r = anchor.getBoundingClientRect();
    let left = r.right - menuEl.offsetWidth;
    let top = r.bottom + 6;
    if (left < 8) left = 8;
    if (top + menuEl.offsetHeight > window.innerHeight - 8) top = r.top - menuEl.offsetHeight - 6;
    menuEl.style.left = left + "px"; menuEl.style.top = top + "px";
    setTimeout(() => {
      document.addEventListener("click", onDocClick, true);
      document.addEventListener("keydown", onMenuKey);
      window.addEventListener("scroll", closeMenu, true);
    }, 0);
  }

  /* Cover photo */
  function pickPhoto(id) { photoTarget = id; $("#photoIn").click(); }
  $("#photoIn").onchange = function () {
    const f = this.files[0]; if (!f || !photoTarget) return;
    const id = photoTarget; const name = idx.get(id).node.label; const had = !!IMAGES[id];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 680; let w = img.width, h = img.height;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        IMAGES[id] = c.toDataURL("image/jpeg", 0.72);
        saveImages(); renderGrid();
        toast(had ? "Photo updated · " + name : "Photo added · " + name);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    this.value = "";
  };

  /* Link modal */
  function openLink(id) {
    moTarget = id; const node = idx.get(id).node; const cur = linkOf(node);
    $("#moT").textContent = "Link — " + node.label;
    $("#moIn").value = cur || ""; $("#moIn").style.borderColor = "";
    $("#moRm").style.display = cur ? "inline-block" : "none";
    $("#ov").classList.add("show"); setTimeout(() => $("#moIn").focus(), 30);
  }
  function closeLink() { $("#ov").classList.remove("show"); moTarget = null; }
  function saveLink() {
    const v = $("#moIn").value.trim();
    if (v && !v.includes("figma.com")) { $("#moIn").style.borderColor = "#e0483a"; return; }
    const had = !!linkOf(idx.get(moTarget).node);
    const name = idx.get(moTarget).node.label;
    LINKS[moTarget] = v; saveLinks(); closeLink(); render();
    toast(v ? (had ? "Link updated · " + name : "Link added · " + name) : "Link removed · " + name);
  }
  $("#moSave").onclick = saveLink;
  $("#moRm").onclick = () => { const name = idx.get(moTarget).node.label; LINKS[moTarget] = ""; saveLinks(); closeLink(); render(); toast("Link removed · " + name); };
  $("#moCancel").onclick = closeLink;
  $("#moIn").onkeydown = (e) => { if (e.key === "Enter") saveLink(); };
  $("#ov").onclick = (e) => { if (e.target === $("#ov")) closeLink(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#ov").classList.contains("show")) closeLink(); });

  /* Screen view removed — linked cards open Figma directly */

  /* Edit mode (owner only) */
  function updateEditBtn() {
    const eb = $("#editBtn");
    eb.classList.toggle("on", editing);
    eb.innerHTML = editing
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Done'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg> Edit';
  }
  function openPass() { $("#povIn").value = ""; $("#povIn").style.borderColor = ""; $("#pov").classList.add("show"); setTimeout(() => $("#povIn").focus(), 30); }
  function closePass() { $("#pov").classList.remove("show"); }
  function tryUnlock() {
    if ($("#povIn").value === EDIT_CODE) { editing = true; closePass(); render(); }
    else $("#povIn").style.borderColor = "#e0483a";
  }

  async function init() {
    $("#brandName").innerHTML = CATALOGUE.title + "<b>.</b>";
    $("#editBtn").onclick = () => { if (editing) { editing = false; closeMenu(); render(); } else openPass(); };
    $("#povOk").onclick = tryUnlock;
    $("#povCancel").onclick = closePass;
    $("#povIn").onkeydown = (e) => { if (e.key === "Enter") tryUnlock(); };
    $("#pov").onclick = (e) => { if (e.target === $("#pov")) closePass(); };
    await load();
    render();
    setInterval(poll, 20000);
  }
  document.addEventListener("DOMContentLoaded", init);
})();
</script>
